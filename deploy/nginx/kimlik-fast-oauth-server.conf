# Included only by the kimlik.az vhost. HTTP/2 is enabled by its cPanel vhost.
if ($scheme = http) { return 308 https://$host$request_uri; }
brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_types text/css application/javascript application/json image/svg+xml;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Avoid the Apache TLS hop for these Next-owned routes.
location ^~ /_next/static/ {
    alias /home/ugn/next.wallet.az/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location ~ ^/(?:az/|en/|ru/)?login$ {
    proxy_pass http://127.0.0.1:3033;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_cache kimlik_login;
    proxy_cache_key "$host|$kimlik_shell_locale|$kimlik_shell_client|$kimlik_shell_redirect";
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_cache_bypass $kimlik_shell_invalid $kimlik_private_request;
    proxy_no_cache $kimlik_shell_invalid $kimlik_private_request $kimlik_response_private $upstream_http_set_cookie;
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Kimlik-Shell-Cache $upstream_cache_status always;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
}
location ~ ^/(?:az/|en/|ru/)?oauth/authorize$ {
    proxy_pass http://127.0.0.1:3033;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
location = /api/session {
    proxy_pass http://127.0.0.1:3033;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}
