# http context. Public shell only; no authorization or user responses are shared.
proxy_cache_path /var/cache/nginx/kimlik-login levels=1:2 keys_zone=kimlik_login:10m max_size=100m inactive=10m use_temp_path=off;
map $arg_return_url $kimlik_shell_origin {
    default 0;
    "~*^https%3A%2F%2Fkimlik\.az%2F(?:az%2F|en%2F|ru%2F)?oauth%2Fauthorize%3F" 1;
    "~*^%2F(?:az%2F|en%2F|ru%2F)?oauth%2Fauthorize%3F" 1;
}
map $arg_return_url $kimlik_shell_client {
    default "";
    "~*(?:%3F|%26)client_id%3D(?<kimlik_public_client>[a-f0-9-]{36})(?:%26|$)" $kimlik_public_client;
}
map $arg_return_url $kimlik_shell_redirect {
    default "";
    "~*(?:%3F|%26)redirect_uri%3D(?<kimlik_public_redirect>https?%253A%252F%252F.+?)(?:%26|$)" $kimlik_public_redirect;
}
map "$uri:$cookie_NEXT_LOCALE:$arg_hl" $kimlik_shell_locale {
    default az;
    "~^/en/" en;
    "~^/ru/" ru;
    "~^/az/" az;
    "~:en:" en;
    "~:ru:" ru;
    "~::en$" en;
    "~::ru$" ru;
}
map "$host:$kimlik_shell_origin:$kimlik_shell_client:$kimlik_shell_redirect" $kimlik_shell_invalid {
    default 1;
    "~^kimlik\.az:1:.+:.+$" 0;
}
map "$http_cookie$http_authorization$http_rsc$http_next_router_state_tree$http_next_router_prefetch" $kimlik_private_request {
    default 1;
    "" 0;
}

# Only the explicitly marked, state-free response may enter the shared cache.
map $upstream_http_x_kimlik_public_shell $kimlik_response_private {
    default 1;
    "1" 0;
}
